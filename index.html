<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZZAP!64 — Cover Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="title-block">
      <h1>ZZAP!<span class="accent">64</span></h1>
      <p class="subtitle">Cover Collection &mdash; <span id="count">0</span> issues</p>
    </div>
    <div class="controls">
      <label>
        <span>Sort</span>
        <select id="sort">
          <option value="issue-asc">Issue &#8593;</option>
          <option value="issue-desc">Issue &#8595;</option>
          <option value="date-asc">Date &#8593;</option>
          <option value="date-desc">Date &#8595;</option>
        </select>
      </label>
      <label>
        <span>Year</span>
        <select id="year">
          <option value="all">All</option>
        </select>
      </label>
    </div>
  </header>

  <main id="grid" class="grid" aria-label="Magazine covers"></main>

  <footer class="site-footer">
    <p>Zzap!64 &copy; Newsfield Publications / Europress &mdash; covers shown for archival/educational use.</p>
  </footer>

  <div id="lightbox" class="lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Cover viewer">
    <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous cover">&#10094;</button>
    <figure class="lb-figure">
      <img id="lb-img" alt="">
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button class="lb-nav lb-next" id="lb-next" aria-label="Next cover">&#10095;</button>
  </div>

  <script src="assets/covers.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
